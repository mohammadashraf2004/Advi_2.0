version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: advi_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: advi_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Advi/Dockerfile
    container_name: advi_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - mongodb
      - qdrant
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: advi_prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: advi_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: advi_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongodb_data:
  qdrant_data:
  prometheus_data:
  grafana_data: